<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>人生主控表・資料層測試</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { max-width: 760px; margin: 0 auto; padding: 24px; background: #07101e; color: #f2f7fb; line-height: 1.6; }
      h1 { font-size: 1.6rem; }
      .summary { padding: 16px; border: 1px solid #2b405a; border-radius: 14px; background: #111f34; }
      li { margin: 8px 0; }
      .pass { color: #5ee6c6; }
      .fail { color: #ff8b94; }
    </style>
  </head>
  <body>
    <h1>資料層自動測試</h1>
    <p id="summary" class="summary">測試執行中…</p>
    <ol id="results"></ol>
    <script src="data-core.js"></script>
    <script src="data-store.js"></script>
    <script src="app.js"></script>
    <script>
      (() => {
        "use strict";
        const Core = window.LifeCalibrationCore;
        const CalendarRepeatUX = window.LifeCalibrationCalendarRepeatUX;
        const TaskUX = window.LifeCalibrationTaskUX;
        const MoneyHistoryUX = window.LifeCalibrationMoneyHistoryUX;
        const TransactionDateUX = window.LifeCalibrationTransactionDateUX;
        const results = [];

        function test(name, action) {
          try {
            action();
            results.push({ name, pass: true });
          } catch (error) {
            results.push({ name, pass: false, error: error.message });
          }
        }

        function equal(actual, expected) {
          if (actual !== expected) throw new Error(`預期 ${expected}，實際 ${actual}`);
        }

        function createMemoryStorage() {
          const values = new Map();
          return {
            getItem: key => values.has(key) ? values.get(key) : null,
            setItem: (key, value) => values.set(key, String(value)),
            removeItem: key => values.delete(key)
          };
        }

        function createMemoryStore(storage = createMemoryStorage()) {
          return window.LifeCalibrationData.create({
            core: Core,
            storage,
            now: () => new Date("2026-08-01T12:00:00+08:00")
          });
        }

        function editCalendarRepeat(store, obligationId, eventId, cycleType, dueDate) {
          const before = store.readState();
          const obligation = before.obligations.find(item => item.id === obligationId);
          const event = before.events.find(item => item.id === eventId && item.status === "pending");
          const result = CalendarRepeatUX.calendarRepeatCycleState({
            cycleType,
            dueDate,
            existingCycle: obligation?.cycle || null,
            originalCycleType: obligation?.cycle.type || "",
            originalDueDate: event?.dueDate || null,
            intervalDays: obligation?.cycle.days || 1
          });
          if (result.error) throw new Error(result.error);
          store.updateObligation(obligationId, { cycle: result.cycle });
          store.updateEvent(eventId, { dueDate });
          return result;
        }

        test("空白資料為 schema v5", () => equal(Core.createEmptyState().version, 5));
        test("核心缺席時不得建立資料模組或寫入 localStorage", () => {
          let reads = 0;
          let writes = 0;
          const storage = {
            getItem: () => { reads += 1; return null; },
            setItem: () => { writes += 1; },
            removeItem: () => { writes += 1; }
          };
          let error = "";
          try { window.LifeCalibrationData.create({ core: null, storage }); } catch (caught) { error = caught.message; }
          equal(error, "資料模組缺少核心函式。");
          equal(reads, 0);
          equal(writes, 0);

          const request = new XMLHttpRequest();
          request.open("GET", "./app.js", false);
          request.send();
          if (request.responseText.includes("globalThis.LifeCalibrationCore ||")) throw new Error("仍存在核心 fallback");
          if (!request.responseText.includes("if (!RuntimeCore)")) throw new Error("缺少核心停止條件");
        });
        test("預設分類依 v0.3 指定順序", () => equal(Core.DEFAULT_CATEGORIES.join("、"), "吃飯、咖啡、加油、交通、衣物、生活、醫療、其他"));
        test("空白資料包含全部 v3 型別", () => {
          const state = Core.createEmptyState();
          ["obligations", "events", "accounts", "categories", "books", "schedule"].forEach(key => {
            if (!Array.isArray(state[key])) throw new Error(`缺少 ${key}`);
          });
        });
        test("預設三帳戶與設定正確", () => {
          const state = Core.createEmptyState();
          equal(state.accounts.map(item => item.name).join("、"), "主帳戶、現金、信用卡");
          equal(state.settings.radarDays, 7);
          equal(state.settings.monthlyIncomeTarget, 60000);
          equal(state.accounts.some(item => Object.prototype.hasOwnProperty.call(item, "startingBalance")), false);
          equal(Core.createEmptyDay().workRevenue, null);
        });
        test("備份提醒略過後當天不再顯示、隔天恢復", () => {
          const state = Core.createEmptyState(new Date("2026-07-01T00:00:00+08:00"));
          state.days["2026-08-01"] = Core.createEmptyDay();
          state.days["2026-08-01"].note = "有資料";
          state.meta.backupSnoozedDate = "2026-08-01";
          equal(Core.shouldShowBackupReminder(state, "2026-08-01", new Date("2026-08-01T12:00:00+08:00").getTime()), false);
          equal(Core.shouldShowBackupReminder(state, "2026-08-02", new Date("2026-08-02T12:00:00+08:00").getTime()), true);
        });
        test("匯出會寫入時間、重置提醒並產生含時分檔名", () => {
          const store = createMemoryStore();
          store.writeDayField("2026-08-01", "note", "匯出測試");
          store.snoozeBackupReminder("2026-08-01");
          const exported = JSON.parse(store.exportJson({ markExported: true }));
          equal(exported.meta.lastExportAt, "2026-08-01T04:00:00.000Z");
          equal(exported.meta.backupSnoozedDate, null);
          equal(Core.shouldShowBackupReminder(store.readState(), "2026-08-01", new Date("2026-08-01T12:00:00+08:00").getTime()), false);
          const filenameTime = new Date(2026, 7, 1, 12, 34);
          equal(Core.exportFilename("json", filenameTime), "TAKO_2026-08-01_1234.json");
          equal(Core.exportFilename("csv", filenameTime), "TAKO_2026-08-01_1234.csv");
        });
        test("跨午夜睡眠 23:30–07:00 為 450 分鐘", () => equal(Core.durationBetweenTimes("23:30", "07:00"), 450));
        test("缺少時間時不產生錯誤數字", () => equal(Core.durationBetweenTimes("09:00", ""), null));
        test("未完成工作段不計工時", () => equal(Core.workMinutes([{ start: "09:00", end: "17:00" }, { start: "18:00", end: "" }]), 480));
        test("收入減支出得到正確淨額且移轉不影響", () => equal(Core.dayNet({ transactions: [{ type: "income", amount: 1000 }, { type: "expense", amount: 350 }, { type: "transfer", amount: 500 }] }), 650));
        test("MONEY RECENT 是含今天的 rolling 7 calendar days", () => {
          const transactions = [
            { id: "day-7", occurredOn: "2026-08-03" },
            { id: "cutoff", occurredOn: "2026-08-04" },
            { id: "today", occurredOn: "2026-08-10" },
            { id: "future", occurredOn: "2026-08-11" }
          ];
          const view = MoneyHistoryUX.partitionMoneyTransactions(transactions, "2026-08-10");
          equal(view.recentStart, "2026-08-04");
          equal(view.recent.map(item => item.id).join(","), "today,cutoff");
          equal(view.history.map(item => item.id).join(","), "day-7");
          equal(view.future.map(item => item.id).join(","), "future");
        });
        test("WEEKLY HISTORY 固定以 local Monday–Sunday 分組並正確跨月跨年", () => {
          equal(MoneyHistoryUX.mondayKey("2026-08-02"), "2026-07-27");
          equal(MoneyHistoryUX.mondayKey("2026-08-03"), "2026-08-03");
          equal(MoneyHistoryUX.formatHistoryWeekRange("2026-07-27", "2026-08-02"), "7/27–8/2");
          equal(MoneyHistoryUX.formatHistoryWeekRange("2026-12-28", "2027-01-03"), "12/28/2026–1/3/2027");
        });
        test("Recent 與 History 無重複、聯集完整，週與日皆由新到舊", () => {
          const transactions = [
            { id: "r1", occurredOn: "2026-08-25" },
            { id: "r2", occurredOn: "2026-08-19" },
            { id: "h1", occurredOn: "2026-08-09" },
            { id: "h2", occurredOn: "2026-08-03" },
            { id: "h3", occurredOn: "2026-08-02" },
            { id: "h4", occurredOn: "2026-07-27" }
          ];
          const view = MoneyHistoryUX.partitionMoneyTransactions(transactions, "2026-08-25");
          const recentIds = new Set(view.recent.map(item => item.id));
          const historyIds = new Set(view.history.map(item => item.id));
          if ([...recentIds].some(id => historyIds.has(id))) throw new Error("Recent 與 History IDs overlap");
          equal(new Set([...recentIds, ...historyIds]).size, transactions.length);
          equal(view.weeks.map(week => week.startKey).join(","), "2026-08-03,2026-07-27");
          equal(view.weeks[0].transactions.map(item => item.occurredOn).join(","), "2026-08-09,2026-08-03");
          equal(view.weeks[1].transactions.map(item => item.occurredOn).join(","), "2026-08-02,2026-07-27");
        });
        test("修改 occurredOn 會移動同一 transaction 並重新歸組", () => {
          const store = createMemoryStore();
          store.addTransaction("2026-08-03", { id: "move-me", type: "expense", amount: 88, category: "測試", paymentMethod: "cash", occurredOn: "2026-08-03" });
          const before = store.readState();
          const beforeBalances = JSON.stringify(Core.accountBalances(before));
          equal(store.updateTransaction("2026-08-03", "move-me", { occurredOn: "2026-08-10" }), true);
          const after = store.readState();
          equal(after.days["2026-08-03"].transactions.length, 0);
          equal(after.days["2026-08-10"].transactions[0].id, "move-me");
          equal(after.days["2026-08-10"].transactions[0].occurredOn, "2026-08-10");
          equal(Core.allTransactions(after).length, 1);
          equal(MoneyHistoryUX.partitionMoneyTransactions(Core.allTransactions(after), "2026-08-10").recent[0].id, "move-me");
          equal(Core.monthExpense(after, "2026-08"), Core.monthExpense(before, "2026-08"));
          equal(JSON.stringify(Core.accountBalances(after)), beforeBalances);
        });
        test("History 共用既有 transaction renderer、editor、AUTO 與 expense title", () => {
          const request = new XMLHttpRequest();
          request.open("GET", "./app.js?test=money-weekly-history", false);
          request.send();
          const app = request.responseText;
          if (!app.includes("function transactionMarkup") || !app.includes("function transactionDaysMarkup")) throw new Error("缺少共用 transaction renderer");
          if ((app.match(/data-transaction-field=\"amount\"/g) || []).length !== 1) throw new Error("transaction editor markup 被複製");
          if (!app.includes('data-transaction-field="occurredOn"')) throw new Error("history editor 缺少 Date 欄位");
          if (!app.includes('class="weekly-history-group"') || !app.includes("transactionDaysMarkup(week.transactions")) throw new Error("weekly group 未重用日／交易 renderer");
          if (!app.includes('class="auto-tag"') || !app.includes("RuntimeCore.transactionDisplayName(transaction)")) throw new Error("AUTO 或 expense display title 遺失");
        });
        test("transaction Date formatter 固定輸出 YYYY/MM/DD 且拒絕非法 date key", () => {
          equal(TransactionDateUX.formatDateInputDisplay("2026-08-03"), "2026/08/03");
          equal(TransactionDateUX.formatDateInputDisplay("2026-02-29"), "");
          equal(TransactionDateUX.formatDateInputDisplay("03/08/2026"), "");
        });
        test("transaction Date 將固定顯示與原生 date input 分離", () => {
          const request = new XMLHttpRequest();
          request.open("GET", "./app.js?test=ios-transaction-date", false);
          request.send();
          const app = request.responseText;
          const start = app.indexOf("function transactionMarkup");
          const end = app.indexOf("\n  function transactionDaysMarkup", start);
          const source = app.slice(start, end);
          [
            'class="transaction-date-control"',
            'class="transaction-date-display" aria-hidden="true"',
            'type="date"',
            'value="${escapeHtml(occurredOn)}"',
            'data-transaction-field="occurredOn"',
            'aria-label="Date"',
            "formatDateInputDisplay(occurredOn)"
          ].forEach(rule => {
            if (!source.includes(rule)) throw new Error(`transaction Date markup 缺少：${rule}`);
          });
          if (source.includes("formatDisplayDate(occurredOn)") || source.includes("toLocaleDateString")) {
            throw new Error("transaction Date visible display 仍依賴 locale formatter");
          }
        });
        test("transaction Date CSS containment 保留透明原生互動層", () => {
          const request = new XMLHttpRequest();
          request.open("GET", "./style.css?test=ios-transaction-date", false);
          request.send();
          const css = request.responseText;
          const wrapper = css.match(/\.transaction-date-control\s*\{([^}]*)\}/s)?.[1] || "";
          ["position: relative", "width: 100%", "min-width: 0", "max-width: 100%", "height: 44px", "min-height: 44px", "overflow: hidden", "box-sizing: border-box"].forEach(rule => {
            if (!wrapper.includes(rule)) throw new Error(`transaction Date wrapper 缺少：${rule}`);
          });
          const input = css.match(/\.transaction-date-control input\[type="date"\]\s*\{([^}]*)\}/s)?.[1] || "";
          ["position: absolute", "inset: 0", "display: block", "width: 100%", "min-width: 0", "max-width: 100%", "height: 100%", "box-sizing: border-box", "margin: 0", "padding: 0", "opacity: 0", "cursor: pointer"].forEach(rule => {
            if (!input.includes(rule)) throw new Error(`transaction native Date input 缺少：${rule}`);
          });
          if (/display:\s*none|visibility:\s*hidden|pointer-events:\s*none/.test(input)) throw new Error("transaction native Date input 不再可互動");
          if (!css.includes(".transaction-date-control:focus-within")) throw new Error("transaction Date 缺少 focus indicator");
        });
        test("History partition 不修改資料源或現行會計結果", () => {
          const state = Core.createEmptyState();
          state.days["2026-07-01"] = Core.createEmptyDay();
          state.days["2026-07-01"].transactions = [
            Core.normalizeTransaction({ id: "old-expense", type: "expense", amount: 120, category: "舊交易", paymentMethod: "card", occurredOn: "2026-07-01" }, "2026-07-01")
          ];
          state.days["2026-08-10"] = Core.createEmptyDay();
          state.days["2026-08-10"].transactions = [
            Core.normalizeTransaction({ id: "new-income", type: "income", amount: 500, accountId: "main", occurredOn: "2026-08-10" }, "2026-08-10")
          ];
          const before = JSON.stringify(state);
          const balances = JSON.stringify(Core.accountBalances(state));
          const all = Core.allTransactions(state);
          const view = MoneyHistoryUX.partitionMoneyTransactions(all, "2026-08-10");
          equal(view.recent.length + view.history.length + view.future.length, all.length);
          equal(JSON.stringify(state), before);
          equal(JSON.stringify(Core.accountBalances(state)), balances);
          equal(Core.allTransactions(state).length, 2);
        });
        test("最近七天固定產生七列", () => equal(Core.summarizeReview(Core.createEmptyState(), "2026-08-01").rows.length, 7));
        test("CSV 會包住逗號並跳脫雙引號", () => equal(Core.csvEscape('餐飲,"晚餐"'), '"餐飲,""晚餐"""'));
        test("CSV 輸出包含中文標題", () => {
          const state = Core.createEmptyState();
          state.days["2026-08-01"] = Core.createEmptyDay();
          if (!Core.buildCsv(state).startsWith("資料類型,日期,識別碼")) throw new Error("缺少預期標題");
        });
        test("v1 匯入資料通過版本檢查", () => equal(Core.validateImportedState({ version: 1, days: {}, projects: [] }).valid, true));
        test("v2 匯入資料通過版本檢查", () => equal(Core.validateImportedState({ version: 2, days: {}, projects: [] }).valid, true));
        test("v3 匯入資料通過版本檢查", () => equal(Core.validateImportedState(Core.createEmptyState()).valid, true));
        test("匯入版本清單接受 v1 到 v5", () => equal(Core.SUPPORTED_IMPORT_VERSIONS.join(","), "1,2,3,4,5"));
        test("錯誤版本不會通過匯入檢查", () => equal(Core.validateImportedState({ version: 99, days: {}, projects: [] }).valid, false));
        test("v1 每日資料、交易與專案升級後一筆不失", () => {
          const upgraded = Core.normalizeState({
            version: 1,
            days: { "2026-08-01": { ...Core.createEmptyDay(), note: "保留", transactions: [{ id: "old-money", type: "expense", amount: 88, category: "舊分類", note: "舊備註" }] } },
            projects: [{ id: "old-project", name: "舊專案", status: "active", nextStep: "繼續" }],
            customCategories: ["舊分類"],
            meta: {}
          });
          equal(upgraded.version, 5);
          equal(upgraded.days["2026-08-01"].note, "保留");
          equal(upgraded.days["2026-08-01"].transactions.length, 1);
          equal(upgraded.days["2026-08-01"].transactions[0].title, "舊備註");
          equal(upgraded.projects.length, 1);
          equal(upgraded.categories.some(item => item.name === "舊分類"), true);
        });
        test("v2 單一 Starting balance 轉成有標記的收入交易", () => {
          const legacy = Core.createEmptyState(new Date("2026-07-15T20:00:00+08:00"));
          legacy.version = 2;
          legacy.accounts.forEach(account => { account.startingBalance = account.id === "main" ? 1000 : 0; });
          const upgraded = Core.normalizeState(legacy);
          const transaction = Core.allTransactions(upgraded).find(item => item.migrationMarker?.startsWith(Core.STARTING_BALANCE_MIGRATION));
          equal(transaction.type, "income");
          equal(transaction.amount, 1000);
          equal(transaction.accountId, "main");
          equal(transaction.title, "期初金額移轉");
          equal(transaction.occurredOn, "2026-07-15");
          equal(Object.prototype.hasOwnProperty.call(upgraded.accounts[0], "startingBalance"), false);
        });
        test("v2 多帳戶 Starting balance 各自保留餘額", () => {
          const legacy = Core.createEmptyState(new Date("2026-07-15T12:00:00+08:00"));
          legacy.version = 2;
          legacy.accounts.find(item => item.id === "main").startingBalance = 1000;
          legacy.accounts.find(item => item.id === "cash").startingBalance = 200;
          legacy.accounts.find(item => item.id === "card").startingBalance = -300;
          const upgraded = Core.normalizeState(legacy);
          const migrated = Core.allTransactions(upgraded).filter(item => item.migrationMarker?.startsWith(Core.STARTING_BALANCE_MIGRATION));
          equal(migrated.length, 3);
          const balances = Core.accountBalances(upgraded);
          equal(balances.main, 1000);
          equal(balances.cash, 200);
          equal(balances.card, -300);
        });
        test("零元 Starting balance 不生成交易或空白日期", () => {
          const legacy = Core.createEmptyState(new Date("2026-07-15T12:00:00+08:00"));
          legacy.version = 2;
          legacy.accounts.forEach(account => { account.startingBalance = 0; });
          const upgraded = Core.normalizeState(legacy);
          equal(Core.allTransactions(upgraded).length, 0);
          equal(Object.keys(upgraded.days).length, 0);
        });
        test("Starting balance 遷移重跑與 JSON round trip 不重複", () => {
          const legacy = Core.createEmptyState(new Date("2026-07-15T12:00:00+08:00"));
          legacy.version = 2;
          legacy.accounts[0].startingBalance = 1000;
          const first = Core.normalizeState(legacy);
          const second = Core.normalizeState(first);
          const roundTrip = Core.normalizeState(JSON.parse(JSON.stringify(second)));
          equal(Core.allTransactions(first).length, 1);
          equal(Core.allTransactions(second).length, 1);
          equal(Core.allTransactions(roundTrip).length, 1);
        });
        test("Starting balance 日期無效時使用最早舊資料日期", () => {
          const legacy = Core.createEmptyState();
          legacy.version = 2;
          legacy.meta.createdAt = "invalid";
          legacy.days["2026-07-20"] = Core.createEmptyDay();
          legacy.days["2026-07-05"] = Core.createEmptyDay();
          legacy.accounts[0].startingBalance = 50;
          const upgraded = Core.normalizeState(legacy);
          equal(Core.allTransactions(upgraded)[0].occurredOn, "2026-07-05");
        });
        test("v2 Done 專案與 Finished 書籍移除，其餘狀態保留", () => {
          const legacy = Core.createEmptyState();
          legacy.version = 2;
          legacy.projects = [
            { id: "p1", name: "Active", status: "active" },
            { id: "p2", name: "Paused", status: "paused" },
            { id: "p3", name: "Done", status: "done" }
          ];
          legacy.books = [
            { id: "b1", name: "Current", status: "current" },
            { id: "b2", name: "Queued", status: "queued" },
            { id: "b3", name: "Frozen", status: "frozen" },
            { id: "b4", name: "Finished", status: "finished" }
          ];
          const upgraded = Core.normalizeState(legacy);
          equal(upgraded.projects.map(item => item.status).join(","), "active,paused");
          equal(upgraded.books.map(item => item.status).join(","), "current,queued,frozen");
          equal(JSON.stringify(upgraded).includes('"status":"done"'), false);
          equal(JSON.stringify(upgraded).includes('"status":"finished"'), false);
        });
        test("workRevenue 正規化、月加總與每日記錄判定正確", () => {
          const state = Core.createEmptyState();
          state.days["2026-08-01"] = { ...Core.createEmptyDay(), workRevenue: 1200 };
          state.days["2026-08-02"] = { ...Core.createEmptyDay(), workRevenue: "800" };
          state.days["2026-08-03"] = { ...Core.createEmptyDay(), workRevenue: -1 };
          state.days["2026-07-31"] = { ...Core.createEmptyDay(), workRevenue: 500 };
          const normalized = Core.normalizeState(state);
          equal(normalized.days["2026-08-03"].workRevenue, null);
          equal(Core.monthWorkRevenue(normalized, "2026-08"), 2000);
          equal(Core.hasDayRecord(normalized.days["2026-08-01"]), true);
          equal(Core.hasDayRecord({ ...Core.createEmptyDay(), workRevenue: 0 }), true);
        });
        test("資料模組可讀寫每日欄位且回傳副本", () => {
          const store = createMemoryStore();
          store.writeDayField("2026-08-01", "note", "測試");
          const day = store.readDay("2026-08-01");
          equal(day.note, "測試");
          day.note = "外部修改";
          equal(store.readDay("2026-08-01").note, "測試");
        });
        test("資料模組支援新增修改刪除收支", () => {
          const store = createMemoryStore();
          store.addTransaction("2026-08-01", { id: "money-1", type: "expense", amount: 50, category: "寵物", note: "" });
          store.updateTransaction("2026-08-01", "money-1", { amount: 80 });
          equal(store.readDay("2026-08-01").transactions[0].amount, 80);
          equal(store.readState().categories.some(item => item.name === "寵物" && item.lastAmount === 80), true);
          store.deleteTransaction("2026-08-01", "money-1");

        // 這條只驗「規則存在且互相一致」，不驗 iPhone 上長什麼樣。
        // 狀態列滿版與 safe area 的實際表現只有實機能判定，headless 一律不得代為宣告通過。
        test("PWA 滿版與 safe-area 規則存在且一致（結構檢查，非實機驗收）", () => {
          const indexRequest = new XMLHttpRequest();
          indexRequest.open("GET", "./index.html?v=0.5.0", false);
          indexRequest.send();
          const documentCopy = new DOMParser().parseFromString(indexRequest.responseText, "text/html");

          const viewport = documentCopy.querySelector('meta[name="viewport"]')?.getAttribute("content") || "";
          // viewport-fit=cover：沒有它，iOS 的 env(safe-area-inset-*) 一律回傳 0，
          // 底下那些 safe-area padding 全是空轉，狀態列也不會滿版。
          if (!/viewport-fit\s*=\s*cover/.test(viewport)) throw new Error("viewport 缺少 viewport-fit=cover");
          // 防自動放大的鎖不得因為加 cover 而掉了
          if (!/maximum-scale\s*=\s*1/.test(viewport)) throw new Error("viewport 遺失 maximum-scale=1");
          if (!/user-scalable\s*=\s*no/.test(viewport)) throw new Error("viewport 遺失 user-scalable=no");

          const meta = name => documentCopy.querySelector(`meta[name="${name}"]`)?.getAttribute("content");
          if (meta("apple-mobile-web-app-capable") !== "yes") throw new Error("缺少 apple-mobile-web-app-capable=yes");
          if (meta("apple-mobile-web-app-status-bar-style") !== "black-translucent") throw new Error("狀態列樣式不是 black-translucent");
          const themeColor = (meta("theme-color") || "").toLowerCase();

          const manifestRequest = new XMLHttpRequest();
          manifestRequest.open("GET", "./manifest.json?v=0.5.0", false);
          manifestRequest.send();
          const manifest = JSON.parse(manifestRequest.responseText);
          if (manifest.display !== "standalone") throw new Error("manifest display 不是 standalone");
          if (String(manifest.background_color).toLowerCase() !== themeColor) {
            throw new Error(`theme-color ${themeColor} 與 manifest background_color ${manifest.background_color} 不一致`);
          }

          const styleRequest = new XMLHttpRequest();
          styleRequest.open("GET", "./style.css?v=0.5.0", false);
          styleRequest.send();
          const css = styleRequest.responseText;

          // canvas 保底實色：--ground 是漸層，漸層填不滿視口外區域，狀態列就會露白底
          const solid = css.match(/--ground-solid:\s*(#[0-9a-fA-F]{6})/)?.[1]?.toLowerCase();
          if (!solid) throw new Error("缺少 --ground-solid（canvas 保底實色）");
          if (solid !== themeColor) throw new Error(`--ground-solid ${solid} 與 theme-color ${themeColor} 不一致`);
          if (!/html\s*\{[^}]*background-color:\s*var\(--ground-solid\)/.test(css)) {
            throw new Error("html 沒有套用 --ground-solid 作為 canvas 保底色");
          }

          // safe area：上緣由 .app-shell 承擔，下緣由 .app-shell 與底部導覽各自承擔
          if (!/env\(safe-area-inset-top\)/.test(css)) throw new Error("缺少 safe-area-inset-top 規則");
          if (!/env\(safe-area-inset-bottom\)/.test(css)) throw new Error("缺少 safe-area-inset-bottom 規則");
          const appShell = css.match(/\.app-shell\s*\{[^}]*\}/)?.[0] || "";
          if (!appShell.includes("env(safe-area-inset-top)")) throw new Error(".app-shell 未保留上緣 safe area");
          if (!appShell.includes("env(safe-area-inset-bottom)")) throw new Error(".app-shell 未保留下緣 safe area");
          const bottomNav = css.match(/\.bottom-nav\s*\{[^}]*\}/)?.[0] || "";
          if (!bottomNav.includes("env(safe-area-inset-bottom)")) throw new Error("底部導覽未保留下緣 safe area");

          // 不得用寫死的狀態列高度把問題蓋掉：上緣一律走 env()，不出現常見的 44/47px 魔術數字
          if (/padding-top:\s*4[47]px/.test(css)) throw new Error("疑似以寫死的狀態列高度處理上緣");
          if (/\.app-shell[^{]*\{[^}]*\b4[47]px/.test(css)) throw new Error(".app-shell 疑似寫死狀態列高度");
        });

          if (positions.some(position => position < 0)) throw new Error("MONEY 區段結構不完整");
          if (!(positions[0] < positions[1] && positions[1] < positions[2])) throw new Error("AUTO PAYMENTS 不在 SPENT 與 RECENT 正中間");

          const group = documentCopy.getElementById("auto-payment-group");
          if (group.tagName !== "DETAILS" || group.hasAttribute("open")) throw new Error("AUTO PAYMENTS 未預設收合");

          const appRequest = new XMLHttpRequest();
          appRequest.open("GET", "./app.js", false);
          appRequest.send();
          const app = appRequest.responseText;
          if (!app.includes('obligation.handling === "auto"') && !app.includes('handling !== "auto"')) throw new Error("TASKS 清單未排除 Automatic");
          const start = app.indexOf("function autoPaymentMarkup");
          const end = app.indexOf("\n  function ", start + 20);
          const source = app.slice(start, end);
          // 再點某一筆才進入可編輯狀態；整段展開時只有清單。
          if (!source.includes("data-toggle-auto-payment")) throw new Error("Auto payment 缺少第二層展開");
          if (!source.includes("taskEditorMarkup(pendingEvent, obligation)")) throw new Error("Auto payment 展開後不是可編輯狀態");
          if (!source.includes("data-freeze-obligation") || !source.includes("data-archive-obligation")) throw new Error("Auto payment 展開操作不完整");
          if (source.includes("data-complete-event")) throw new Error("Auto payment 不應出現人工 Complete");
          if (source.includes("Handling") || source.includes("When done")) throw new Error("Auto payment 仍顯示 Handling／When done");
        });

        test("Quick add 只需名稱，不自動打開 editor，不保留日常 Done 區", () => {
          const indexRequest = new XMLHttpRequest();
          indexRequest.open("GET", "./index.html", false);
          indexRequest.send();
          const documentCopy = new DOMParser().parseFromString(indexRequest.responseText, "text/html");
          if (!documentCopy.getElementById("quick-task-form")) throw new Error("缺少快速建立");
          if (documentCopy.getElementById("obligation-form")) throw new Error("仍保留集中式 obligation form");
          ["task-done", "task-done-group", "task-later", "task-later-list", "task-dated", "task-no-date"].forEach(id => {
            if (documentCopy.getElementById(id)) throw new Error(`仍保留已廢止的區段：${id}`);
          });
          if (!documentCopy.getElementById("task-active")) throw new Error("缺少 TASKS 主清單");
          if (!documentCopy.getElementById("sleeping-list")) throw new Error("缺少 SLEEPING 清單");
          const sleeping = documentCopy.getElementById("sleeping-group");
          if (sleeping.tagName !== "DETAILS" || sleeping.hasAttribute("open")) throw new Error("SLEEPING 未預設收合");

          const appRequest = new XMLHttpRequest();
          appRequest.open("GET", "./app.js", false);
          appRequest.send();
          const app = appRequest.responseText;
          const start = app.indexOf('elements["quick-task-form"].addEventListener');
          const source = app.slice(start, app.indexOf("});", start));
          if (source.includes("openObligationEditor") || source.includes("expandedTaskKey =")) throw new Error("Add 後仍自動打開 editor");
          if (!source.includes("renderTasks()")) throw new Error("Add 後未回到清單");
          if (!app.includes("UNDO_WINDOW_MS = 10000")) throw new Error("Undo 窗口不是 10 秒");
          if (!app.includes("startUndoWindow")) throw new Error("缺少完成後的 UNDO 窗口");
        });

        test("Service Worker 對 warm app shell 採 cache-first 並保留有界網路 fallback", () => {
          const request = new XMLHttpRequest();
          request.open("GET", "./sw.js", false);
          request.send();
          const worker = request.responseText;
          ["APP_SHELL_URLS", "appShellFirst", "isAppNavigation", 'relativePath === "index.html"', "NETWORK_TIMEOUT_MS = 3000", "AbortController", "boundedNetworkFirst"].forEach(rule => {
            if (!worker.includes(rule)) throw new Error(`弱網策略缺少：${rule}`);
          });
        });

        test("TASK 展開後只在摘要顯示一次任務名稱", () => {
          const appRequest = new XMLHttpRequest();
          appRequest.open("GET", "./app.js?v=0.4.0", false);
          appRequest.send();
          const app = appRequest.responseText;
          const functionSource = name => {
            const start = app.indexOf(`function ${name}`);
            if (start < 0) throw new Error(`找不到 ${name}`);
            const rest = app.slice(start + 20);
            const end = rest.indexOf("\n  function ");
            return app.slice(start, start + 20 + (end < 0 ? rest.length : end));
          };

          ["taskSummaryCopy", "frozenTaskMarkup", "autoPaymentMarkup"].forEach(name => {
            const source = functionSource(name);
            if (!source.includes("task-summary")) throw new Error(`${name} 遺失摘要`);
            const visibleNames = source.match(/<strong\b[^>]*>\$\{escapeHtml\(obligation\.name\)\}<\/strong>/g) || [];
            equal(visibleNames.length, 1);
          });
          // 展開後的名稱是可編輯欄位，不是第二個標題。
          const editor = functionSource("taskEditorMarkup");
          if (/<strong\b[^>]*>\$\{escapeHtml\(obligation\.name\)\}<\/strong>/.test(editor)) throw new Error("展開層重複顯示任務名稱");
          if (!editor.includes('data-task-field="name"')) throw new Error("展開層缺少可編輯名稱欄位");
        });

        test("iOS date control 使用自訂外觀與完整原生操作層", () => {
          const indexRequest = new XMLHttpRequest();
          indexRequest.open("GET", "./index.html?v=0.4.0", false);
          indexRequest.send();
          const documentCopy = new DOMParser().parseFromString(indexRequest.responseText, "text/html");
          // Due 已移進每一列的展開編輯狀態，靜態 HTML 只剩里程 modal 的日期欄位。
          const dateInputs = Array.from(documentCopy.querySelectorAll('input[type="date"]'));
          if (dateInputs.length !== 1) throw new Error(`預期一個靜態日期欄位，實際為 ${dateInputs.length}`);
          dateInputs.forEach(input => {
            const control = input.closest(".date-control");
            if (!control?.querySelector(".date-control-value") || !control.querySelector(".date-control-icon")) {
              throw new Error(`${input.id} 未使用共用日期殼層`);
            }
          });

          const styleRequest = new XMLHttpRequest();
          styleRequest.open("GET", "./style.css?v=0.4.0", false);
          styleRequest.send();
          const css = styleRequest.responseText;
          [
            '.date-control input[type="date"]',
            "position: absolute",
            "inset: 0",
            "display: block",
            "-webkit-appearance: none",
            "appearance: none",
            "::-webkit-date-and-time-value",
            "::-webkit-calendar-picker-indicator",
            "opacity: 0"
          ].forEach(rule => {
            if (!css.includes(rule)) throw new Error(`缺少 iOS 日期控制項防護：${rule}`);
          });
          if (/\.date-control[^}]*overflow\s*:\s*hidden/s.test(css)) throw new Error("日期控制項仍以 overflow hidden 遮蔽問題");

          const appRequest = new XMLHttpRequest();
          appRequest.open("GET", "./app.js?v=0.4.0", false);
          appRequest.send();
          if (!appRequest.responseText.includes("syncDateControl") || !appRequest.responseText.includes("date-control-value")) {
            throw new Error("日期顯示未與原生 input 值同步");
          }
        });

        const passed = results.filter(result => result.pass).length;
        document.getElementById("summary").textContent = `${passed} / ${results.length} 項通過`;
        document.getElementById("summary").classList.add(passed === results.length ? "pass" : "fail");
        document.getElementById("results").innerHTML = results.map(result =>
          `<li class="${result.pass ? "pass" : "fail"}">${result.pass ? "通過" : "未通過"}｜${result.name}${result.error ? `｜${result.error}` : ""}</li>`
        ).join("");
        document.title = passed === results.length ? "全部通過｜人生主控表測試" : "測試未通過｜人生主控表測試";
      })();
    </script>
  </body>
</html>
