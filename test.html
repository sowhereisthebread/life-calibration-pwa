<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>人生主控表・資料層測試</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { max-width: 760px; margin: 0 auto; padding: 24px; background: #07101e; color: #f2f7fb; line-height: 1.6; }
      h1 { font-size: 1.6rem; }
      .summary { padding: 16px; border: 1px solid #2b405a; border-radius: 14px; background: #111f34; }
      li { margin: 8px 0; }
      .pass { color: #5ee6c6; }
      .fail { color: #ff8b94; }
    </style>
  </head>
  <body>
    <h1>資料層自動測試</h1>
    <p id="summary" class="summary">測試執行中…</p>
    <ol id="results"></ol>
    <script src="data-core.js"></script>
    <script src="data-store.js"></script>
    <script src="app.js"></script>
    <script>
      (() => {
        "use strict";
        const Core = window.LifeCalibrationCore;
        const MonthlyUX = window.LifeCalibrationMonthlyRepeatUX;
        const ObligationUX = window.LifeCalibrationObligationUX;
        const results = [];

        function test(name, action) {
          try {
            action();
            results.push({ name, pass: true });
          } catch (error) {
            results.push({ name, pass: false, error: error.message });
          }
        }

        function equal(actual, expected) {
          if (actual !== expected) throw new Error(`預期 ${expected}，實際 ${actual}`);
        }

        function createMemoryStorage() {
          const values = new Map();
          return {
            getItem: key => values.has(key) ? values.get(key) : null,
            setItem: (key, value) => values.set(key, String(value)),
            removeItem: key => values.delete(key)
          };
        }

        function createMemoryStore(storage = createMemoryStorage()) {
          return window.LifeCalibrationData.create({
            core: Core,
            storage,
            now: () => new Date("2026-08-01T12:00:00+08:00")
          });
        }

        test("空白資料為 schema v3", () => equal(Core.createEmptyState().version, 3));
        test("核心缺席時不得建立資料模組或寫入 localStorage", () => {
          let reads = 0;
          let writes = 0;
          const storage = {
            getItem: () => { reads += 1; return null; },
            setItem: () => { writes += 1; },
            removeItem: () => { writes += 1; }
          };
          let error = "";
          try { window.LifeCalibrationData.create({ core: null, storage }); } catch (caught) { error = caught.message; }
          equal(error, "資料模組缺少核心函式。");
          equal(reads, 0);
          equal(writes, 0);

          const request = new XMLHttpRequest();
          request.open("GET", "./app.js", false);
          request.send();
          if (request.responseText.includes("globalThis.LifeCalibrationCore ||")) throw new Error("仍存在核心 fallback");
          if (!request.responseText.includes("if (!RuntimeCore)")) throw new Error("缺少核心停止條件");
        });
        test("預設分類依 v0.3 指定順序", () => equal(Core.DEFAULT_CATEGORIES.join("、"), "吃飯、咖啡、加油、交通、衣物、生活、醫療、其他"));
        test("空白資料包含全部 v3 型別", () => {
          const state = Core.createEmptyState();
          ["obligations", "events", "accounts", "categories", "books", "schedule"].forEach(key => {
            if (!Array.isArray(state[key])) throw new Error(`缺少 ${key}`);
          });
        });
        test("預設三帳戶與設定正確", () => {
          const state = Core.createEmptyState();
          equal(state.accounts.map(item => item.name).join("、"), "主帳戶、現金、信用卡");
          equal(state.settings.radarDays, 7);
          equal(state.settings.monthlyIncomeTarget, 60000);
          equal(state.accounts.some(item => Object.prototype.hasOwnProperty.call(item, "startingBalance")), false);
          equal(Core.createEmptyDay().workRevenue, null);
        });
        test("備份提醒略過後當天不再顯示、隔天恢復", () => {
          const state = Core.createEmptyState(new Date("2026-07-01T00:00:00+08:00"));
          state.days["2026-08-01"] = Core.createEmptyDay();
          state.days["2026-08-01"].note = "有資料";
          state.meta.backupSnoozedDate = "2026-08-01";
          equal(Core.shouldShowBackupReminder(state, "2026-08-01", new Date("2026-08-01T12:00:00+08:00").getTime()), false);
          equal(Core.shouldShowBackupReminder(state, "2026-08-02", new Date("2026-08-02T12:00:00+08:00").getTime()), true);
        });
        test("匯出會寫入時間、重置提醒並產生含時分檔名", () => {
          const store = createMemoryStore();
          store.writeDayField("2026-08-01", "note", "匯出測試");
          store.snoozeBackupReminder("2026-08-01");
          const exported = JSON.parse(store.exportJson({ markExported: true }));
          equal(exported.meta.lastExportAt, "2026-08-01T04:00:00.000Z");
          equal(exported.meta.backupSnoozedDate, null);
          equal(Core.shouldShowBackupReminder(store.readState(), "2026-08-01", new Date("2026-08-01T12:00:00+08:00").getTime()), false);
          const filenameTime = new Date(2026, 7, 1, 12, 34);
          equal(Core.exportFilename("json", filenameTime), "TAKO_2026-08-01_1234.json");
          equal(Core.exportFilename("csv", filenameTime), "TAKO_2026-08-01_1234.csv");
        });
        test("跨午夜睡眠 23:30–07:00 為 450 分鐘", () => equal(Core.durationBetweenTimes("23:30", "07:00"), 450));
        test("缺少時間時不產生錯誤數字", () => equal(Core.durationBetweenTimes("09:00", ""), null));
        test("未完成工作段不計工時", () => equal(Core.workMinutes([{ start: "09:00", end: "17:00" }, { start: "18:00", end: "" }]), 480));
        test("收入減支出得到正確淨額且移轉不影響", () => equal(Core.dayNet({ transactions: [{ type: "income", amount: 1000 }, { type: "expense", amount: 350 }, { type: "transfer", amount: 500 }] }), 650));
        test("最近七天固定產生七列", () => equal(Core.summarizeReview(Core.createEmptyState(), "2026-08-01").rows.length, 7));
        test("CSV 會包住逗號並跳脫雙引號", () => equal(Core.csvEscape('餐飲,"晚餐"'), '"餐飲,""晚餐"""'));
        test("CSV 輸出包含中文標題", () => {
          const state = Core.createEmptyState();
          state.days["2026-08-01"] = Core.createEmptyDay();
          if (!Core.buildCsv(state).startsWith("資料類型,日期,識別碼")) throw new Error("缺少預期標題");
        });
        test("v1 匯入資料通過版本檢查", () => equal(Core.validateImportedState({ version: 1, days: {}, projects: [] }).valid, true));
        test("v2 匯入資料通過版本檢查", () => equal(Core.validateImportedState({ version: 2, days: {}, projects: [] }).valid, true));
        test("v3 匯入資料通過版本檢查", () => equal(Core.validateImportedState(Core.createEmptyState()).valid, true));
        test("匯入版本清單只接受 v1、v2、v3", () => equal(Core.SUPPORTED_IMPORT_VERSIONS.join(","), "1,2,3"));
        test("錯誤版本不會通過匯入檢查", () => equal(Core.validateImportedState({ version: 99, days: {}, projects: [] }).valid, false));
        test("v1 每日資料、交易與專案升級後一筆不失", () => {
          const upgraded = Core.normalizeState({
            version: 1,
            days: { "2026-08-01": { ...Core.createEmptyDay(), note: "保留", transactions: [{ id: "old-money", type: "expense", amount: 88, category: "舊分類", note: "舊備註" }] } },
            projects: [{ id: "old-project", name: "舊專案", status: "active", nextStep: "繼續" }],
            customCategories: ["舊分類"],
            meta: {}
          });
          equal(upgraded.version, 3);
          equal(upgraded.days["2026-08-01"].note, "保留");
          equal(upgraded.days["2026-08-01"].transactions.length, 1);
          equal(upgraded.days["2026-08-01"].transactions[0].title, "舊備註");
          equal(upgraded.projects.length, 1);
          equal(upgraded.categories.some(item => item.name === "舊分類"), true);
        });
        test("v2 單一 Starting balance 轉成有標記的收入交易", () => {
          const legacy = Core.createEmptyState(new Date("2026-07-15T20:00:00+08:00"));
          legacy.version = 2;
          legacy.accounts.forEach(account => { account.startingBalance = account.id === "main" ? 1000 : 0; });
          const upgraded = Core.normalizeState(legacy);
          const transaction = Core.allTransactions(upgraded).find(item => item.migrationMarker?.startsWith(Core.STARTING_BALANCE_MIGRATION));
          equal(transaction.type, "income");
          equal(transaction.amount, 1000);
          equal(transaction.accountId, "main");
          equal(transaction.title, "期初金額移轉");
          equal(transaction.occurredOn, "2026-07-15");
          equal(Object.prototype.hasOwnProperty.call(upgraded.accounts[0], "startingBalance"), false);
        });
        test("v2 多帳戶 Starting balance 各自保留餘額", () => {
          const legacy = Core.createEmptyState(new Date("2026-07-15T12:00:00+08:00"));
          legacy.version = 2;
          legacy.accounts.find(item => item.id === "main").startingBalance = 1000;
          legacy.accounts.find(item => item.id === "cash").startingBalance = 200;
          legacy.accounts.find(item => item.id === "card").startingBalance = -300;
          const upgraded = Core.normalizeState(legacy);
          const migrated = Core.allTransactions(upgraded).filter(item => item.migrationMarker?.startsWith(Core.STARTING_BALANCE_MIGRATION));
          equal(migrated.length, 3);
          const balances = Core.accountBalances(upgraded);
          equal(balances.main, 1000);
          equal(balances.cash, 200);
          equal(balances.card, -300);
        });
        test("零元 Starting balance 不生成交易或空白日期", () => {
          const legacy = Core.createEmptyState(new Date("2026-07-15T12:00:00+08:00"));
          legacy.version = 2;
          legacy.accounts.forEach(account => { account.startingBalance = 0; });
          const upgraded = Core.normalizeState(legacy);
          equal(Core.allTransactions(upgraded).length, 0);
          equal(Object.keys(upgraded.days).length, 0);
        });
        test("Starting balance 遷移重跑與 JSON round trip 不重複", () => {
          const legacy = Core.createEmptyState(new Date("2026-07-15T12:00:00+08:00"));
          legacy.version = 2;
          legacy.accounts[0].startingBalance = 1000;
          const first = Core.normalizeState(legacy);
          const second = Core.normalizeState(first);
          const roundTrip = Core.normalizeState(JSON.parse(JSON.stringify(second)));
          equal(Core.allTransactions(first).length, 1);
          equal(Core.allTransactions(second).length, 1);
          equal(Core.allTransactions(roundTrip).length, 1);
        });
        test("Starting balance 日期無效時使用最早舊資料日期", () => {
          const legacy = Core.createEmptyState();
          legacy.version = 2;
          legacy.meta.createdAt = "invalid";
          legacy.days["2026-07-20"] = Core.createEmptyDay();
          legacy.days["2026-07-05"] = Core.createEmptyDay();
          legacy.accounts[0].startingBalance = 50;
          const upgraded = Core.normalizeState(legacy);
          equal(Core.allTransactions(upgraded)[0].occurredOn, "2026-07-05");
        });
        test("v2 Done 專案與 Finished 書籍移除，其餘狀態保留", () => {
          const legacy = Core.createEmptyState();
          legacy.version = 2;
          legacy.projects = [
            { id: "p1", name: "Active", status: "active" },
            { id: "p2", name: "Paused", status: "paused" },
            { id: "p3", name: "Done", status: "done" }
          ];
          legacy.books = [
            { id: "b1", name: "Current", status: "current" },
            { id: "b2", name: "Queued", status: "queued" },
            { id: "b3", name: "Frozen", status: "frozen" },
            { id: "b4", name: "Finished", status: "finished" }
          ];
          const upgraded = Core.normalizeState(legacy);
          equal(upgraded.projects.map(item => item.status).join(","), "active,paused");
          equal(upgraded.books.map(item => item.status).join(","), "current,queued,frozen");
          equal(JSON.stringify(upgraded).includes('"status":"done"'), false);
          equal(JSON.stringify(upgraded).includes('"status":"finished"'), false);
        });
        test("workRevenue 正規化、月加總與每日記錄判定正確", () => {
          const state = Core.createEmptyState();
          state.days["2026-08-01"] = { ...Core.createEmptyDay(), workRevenue: 1200 };
          state.days["2026-08-02"] = { ...Core.createEmptyDay(), workRevenue: "800" };
          state.days["2026-08-03"] = { ...Core.createEmptyDay(), workRevenue: -1 };
          state.days["2026-07-31"] = { ...Core.createEmptyDay(), workRevenue: 500 };
          const normalized = Core.normalizeState(state);
          equal(normalized.days["2026-08-03"].workRevenue, null);
          equal(Core.monthWorkRevenue(normalized, "2026-08"), 2000);
          equal(Core.hasDayRecord(normalized.days["2026-08-01"]), true);
          equal(Core.hasDayRecord({ ...Core.createEmptyDay(), workRevenue: 0 }), true);
        });
        test("資料模組可讀寫每日欄位且回傳副本", () => {
          const store = createMemoryStore();
          store.writeDayField("2026-08-01", "note", "測試");
          const day = store.readDay("2026-08-01");
          equal(day.note, "測試");
          day.note = "外部修改";
          equal(store.readDay("2026-08-01").note, "測試");
        });
        test("資料模組支援新增修改刪除收支", () => {
          const store = createMemoryStore();
          store.addTransaction("2026-08-01", { id: "money-1", type: "expense", amount: 50, category: "寵物", note: "" });
          store.updateTransaction("2026-08-01", "money-1", { amount: 80 });
          equal(store.readDay("2026-08-01").transactions[0].amount, 80);
          equal(store.readState().categories.some(item => item.name === "寵物" && item.lastAmount === 80), true);
          store.deleteTransaction("2026-08-01", "money-1");
          equal(store.readDay("2026-08-01").transactions.length, 0);
        });
        test("資料模組支援工作段增修刪", () => {
          const store = createMemoryStore();
          store.addWorkSession("2026-08-01", { id: "work-1", start: "09:00", end: "" });
          store.updateWorkSession("2026-08-01", "work-1", { end: "17:00" });
          equal(store.readDay("2026-08-01").workSessions[0].end, "17:00");
          store.deleteWorkSession("2026-08-01", "work-1");
          equal(store.readDay("2026-08-01").workSessions.length, 0);
        });
        test("資料模組支援專案增修刪", () => {
          const store = createMemoryStore();
          store.addProject({ id: "project-1", name: "測試", status: "active", nextStep: "第一步", updatedAt: "" });
          store.updateProject("project-1", { status: "paused" });
          equal(store.readState().projects[0].status, "paused");
          store.deleteProject("project-1");
          equal(store.readState().projects.length, 0);
        });
        test("schema v3 的 project／manual／auto／frozen／book 可原樣匯入且 ID 不變", () => {
          const source = createMemoryStore();
          source.addProject({ id: "project-compat", name: "相容專案", status: "active", nextStep: "下一步", updatedAt: "2026-08-01T00:00:00.000Z" });
          source.addObligation({ id: "manual-compat", name: "人工待辦", cycle: { type: "none" }, handling: "manual", completionMode: "none", status: "active" });
          source.addObligation({ id: "auto-compat", name: "自動扣款", cycle: { type: "monthly", day: 8 }, amount: 299, handling: "auto", completionMode: "expense", paymentMethod: "card", status: "active" }, "2026-08-08");
          source.addObligation({ id: "frozen-compat", name: "冷凍待辦", cycle: { type: "none" }, handling: "manual", completionMode: "none", status: "frozen" });
          source.addBook({ id: "book-compat", name: "相容書籍", status: "queued" });

          const importedStore = createMemoryStore();
          const imported = importedStore.importState(JSON.parse(source.exportJson()));
          equal(imported.version, 3);
          equal(imported.projects.find(item => item.id === "project-compat")?.name, "相容專案");
          equal(imported.obligations.find(item => item.id === "manual-compat")?.name, "人工待辦");
          equal(imported.obligations.find(item => item.id === "auto-compat")?.handling, "auto");
          equal(imported.obligations.find(item => item.id === "frozen-compat")?.status, "frozen");
          equal(imported.books.find(item => item.id === "book-compat")?.name, "相容書籍");
        });
        test("資料模組匯入失敗時保留原資料", () => {
          const store = createMemoryStore();
          store.writeDayField("2026-08-01", "note", "保留我");
          try { store.importState({ version: 99, days: {}, projects: [] }); } catch (_) {}
          equal(store.readDay("2026-08-01").note, "保留我");
        });
        test("資料模組可完整匯出並清除", () => {
          const store = createMemoryStore();
          store.writeDayField("2026-08-01", "note", "匯出測試");
          store.addTransaction("2026-08-01", { id: "money-clear", type: "expense", amount: 50, category: "寵物", note: "" });
          if (!store.exportJson().includes("匯出測試")) throw new Error("JSON 未包含資料");
          if (!store.exportCsv().startsWith("資料類型,日期")) throw new Error("CSV 標題錯誤");
          store.clear();
          equal(store.readDay("2026-08-01").note, "");
          equal(store.readState().version, 3);
        });

        function createObligation(cycle, extras = {}) {
          return Core.normalizeObligation({ id: "obligation-1", name: "測試義務", cycle, amount: 100, handling: "manual", completionMode: "expense", paymentMethod: "bank", ...extras });
        }

        function stateWithEvent(cycle, dueDate, extras = {}) {
          const state = Core.createEmptyState();
          const obligation = createObligation(cycle, extras);
          state.obligations.push(obligation);
          state.events.push(Core.normalizeEvent({ id: "event-1", obligationId: obligation.id, dueDate, status: "pending" }));
          return state;
        }

        test("每月 31 日遇二月取月底", () => {
          const state = stateWithEvent({ type: "monthly", day: 31 }, "2026-01-31");
          const result = Core.completeEvent(state, "event-1", { completedDate: "2026-02-03" });
          equal(result.state.events.find(item => item.id !== "event-1").dueDate, "2026-02-28");
        });
        test("每月週期不從延遲完成日算", () => {
          const state = stateWithEvent({ type: "monthly", day: 15 }, "2026-08-15");
          const result = Core.completeEvent(state, "event-1", { completedDate: "2026-09-02" });
          equal(result.state.events.find(item => item.id !== "event-1").dueDate, "2026-09-15");
        });
        test("新增 Monthly 有 Due 時自動推導 repeat day", () => {
          const result = MonthlyUX.monthlyRepeatFieldState({ cycleType: "monthly", dueDate: "2026-08-07", preserveMonthlyDay: false });
          equal(result.label, "Repeat day");
          equal(result.hidden, true);
          equal(result.inferredDay, 7);
        });
        test("新增 Monthly 無 Due 時不猜日期並保留 Repeat day 欄位", () => {
          const result = MonthlyUX.monthlyRepeatFieldState({ cycleType: "monthly", dueDate: "", preserveMonthlyDay: false });
          equal(result.label, "Repeat day");
          equal(result.hidden, false);
          equal(result.inferredDay, null);
        });
        test("既有 Monthly 改本期 Due 時不覆寫長期 repeat day", () => {
          const result = MonthlyUX.monthlyRepeatFieldState({ cycleType: "monthly", dueDate: "2026-09-08", preserveMonthlyDay: true });
          equal(result.hidden, false);
          equal(result.inferredDay, null);
        });
        test("本期特殊改日後下一期仍依長期 Monthly rule 生成", () => {
          const store = createMemoryStore();
          const created = store.addObligation({ name: "月繳", cycle: { type: "monthly", day: 7 } }, "2026-09-07");
          store.updateEvent(created.event.id, { dueDate: "2026-09-08" });
          store.completeEvent(created.event.id, { completedDate: "2026-09-08" });
          const state = store.readState();
          equal(state.obligations[0].cycle.day, 7);
          equal(state.events.find(item => item.status === "pending").dueDate, "2026-10-07");
        });
        test("Monthly 切換 Yearly 後恢復 Cycle day label 與欄位", () => {
          const monthly = MonthlyUX.monthlyRepeatFieldState({ cycleType: "monthly", dueDate: "2026-08-07", preserveMonthlyDay: false });
          const yearly = MonthlyUX.monthlyRepeatFieldState({ cycleType: "yearly", dueDate: "2026-08-07", preserveMonthlyDay: false });
          equal(monthly.label, "Repeat day");
          equal(yearly.label, "Cycle day");
          equal(yearly.hidden, false);
          equal(yearly.inferredDay, null);
        });
        test("每年 2 月 29 日遇非閏年取月底", () => {
          const state = stateWithEvent({ type: "yearly", month: 2, day: 29 }, "2024-02-29");
          const result = Core.completeEvent(state, "event-1", { completedDate: "2024-03-01" });
          equal(result.state.events.find(item => item.id !== "event-1").dueDate, "2025-02-28");
        });
        test("完成後 N 天從完成日算", () => {
          const state = stateWithEvent({ type: "after_days", days: 180 }, "2026-08-01");
          const result = Core.completeEvent(state, "event-1", { completedDate: "2026-08-03" });
          equal(result.state.events.find(item => item.id !== "event-1").dueDate, "2027-01-30");
        });
        test("一次性完成後封存義務", () => {
          const result = Core.completeEvent(stateWithEvent({ type: "once" }, "2026-08-20"), "event-1", { completedDate: "2026-08-20" });
          equal(result.state.obligations[0].status, "archived");
        });
        test("無日期完成後保留下一個無日期事件", () => {
          const result = Core.completeEvent(stateWithEvent({ type: "none" }, null, { amount: null, completionMode: "none" }), "event-1", { completedDate: "2026-08-02", actualAmount: 120 });
          const next = result.state.events.find(item => item.id !== "event-1");
          equal(next.status, "pending");
          equal(next.dueDate, null);
          equal(result.state.events.find(item => item.id === "event-1").actualAmount, 120);
          equal(Core.allTransactions(result.state).length, 0);
        });
        test("每月 No transaction 保留下一期但不建立交易", () => {
          const result = Core.completeEvent(stateWithEvent({ type: "monthly", day: 30 }, "2026-08-30", { amount: null, completionMode: "none", note: "檢查監理服務" }), "event-1", { completedDate: "2026-08-30" });
          equal(result.state.events.find(item => item.id !== "event-1").dueDate, "2026-09-30");
          equal(Core.allTransactions(result.state).length, 0);
          equal(result.state.obligations[0].note, "檢查監理服務");

        // 這條只驗「規則存在且互相一致」，不驗 iPhone 上長什麼樣。
        // 狀態列滿版與 safe area 的實際表現只有實機能判定，headless 一律不得代為宣告通過。
        test("PWA 滿版與 safe-area 規則存在且一致（結構檢查，非實機驗收）", () => {
          const indexRequest = new XMLHttpRequest();
          indexRequest.open("GET", "./index.html?v=0.5.0", false);
          indexRequest.send();
          const documentCopy = new DOMParser().parseFromString(indexRequest.responseText, "text/html");

          const viewport = documentCopy.querySelector('meta[name="viewport"]')?.getAttribute("content") || "";
          // viewport-fit=cover：沒有它，iOS 的 env(safe-area-inset-*) 一律回傳 0，
          // 底下那些 safe-area padding 全是空轉，狀態列也不會滿版。
          if (!/viewport-fit\s*=\s*cover/.test(viewport)) throw new Error("viewport 缺少 viewport-fit=cover");
          // 防自動放大的鎖不得因為加 cover 而掉了
          if (!/maximum-scale\s*=\s*1/.test(viewport)) throw new Error("viewport 遺失 maximum-scale=1");
          if (!/user-scalable\s*=\s*no/.test(viewport)) throw new Error("viewport 遺失 user-scalable=no");

          const meta = name => documentCopy.querySelector(`meta[name="${name}"]`)?.getAttribute("content");
          if (meta("apple-mobile-web-app-capable") !== "yes") throw new Error("缺少 apple-mobile-web-app-capable=yes");
          if (meta("apple-mobile-web-app-status-bar-style") !== "black-translucent") throw new Error("狀態列樣式不是 black-translucent");
          const themeColor = (meta("theme-color") || "").toLowerCase();

          const manifestRequest = new XMLHttpRequest();
          manifestRequest.open("GET", "./manifest.json?v=0.5.0", false);
          manifestRequest.send();
          const manifest = JSON.parse(manifestRequest.responseText);
          if (manifest.display !== "standalone") throw new Error("manifest display 不是 standalone");
          if (String(manifest.background_color).toLowerCase() !== themeColor) {
            throw new Error(`theme-color ${themeColor} 與 manifest background_color ${manifest.background_color} 不一致`);
          }

          const styleRequest = new XMLHttpRequest();
          styleRequest.open("GET", "./style.css?v=0.5.0", false);
          styleRequest.send();
          const css = styleRequest.responseText;

          // canvas 保底實色：--ground 是漸層，漸層填不滿視口外區域，狀態列就會露白底
          const solid = css.match(/--ground-solid:\s*(#[0-9a-fA-F]{6})/)?.[1]?.toLowerCase();
          if (!solid) throw new Error("缺少 --ground-solid（canvas 保底實色）");
          if (solid !== themeColor) throw new Error(`--ground-solid ${solid} 與 theme-color ${themeColor} 不一致`);
          if (!/html\s*\{[^}]*background-color:\s*var\(--ground-solid\)/.test(css)) {
            throw new Error("html 沒有套用 --ground-solid 作為 canvas 保底色");
          }

          // safe area：上緣由 .app-shell 承擔，下緣由 .app-shell 與底部導覽各自承擔
          if (!/env\(safe-area-inset-top\)/.test(css)) throw new Error("缺少 safe-area-inset-top 規則");
          if (!/env\(safe-area-inset-bottom\)/.test(css)) throw new Error("缺少 safe-area-inset-bottom 規則");
          const appShell = css.match(/\.app-shell\s*\{[^}]*\}/)?.[0] || "";
          if (!appShell.includes("env(safe-area-inset-top)")) throw new Error(".app-shell 未保留上緣 safe area");
          if (!appShell.includes("env(safe-area-inset-bottom)")) throw new Error(".app-shell 未保留下緣 safe area");
          const bottomNav = css.match(/\.bottom-nav\s*\{[^}]*\}/)?.[0] || "";
          if (!bottomNav.includes("env(safe-area-inset-bottom)")) throw new Error("底部導覽未保留下緣 safe area");

          // 不得用寫死的狀態列高度把問題蓋掉：上緣一律走 env()，不出現常見的 44/47px 魔術數字
          if (/padding-top:\s*4[47]px/.test(css)) throw new Error("疑似以寫死的狀態列高度處理上緣");
          if (/\.app-shell[^{]*\{[^}]*\b4[47]px/.test(css)) throw new Error(".app-shell 疑似寫死狀態列高度");
        });

        });

        const passed = results.filter(result => result.pass).length;
        document.getElementById("summary").textContent = `${passed} / ${results.length} 項通過`;
        document.getElementById("summary").classList.add(passed === results.length ? "pass" : "fail");
        document.getElementById("results").innerHTML = results.map(result =>
          `<li class="${result.pass ? "pass" : "fail"}">${result.pass ? "通過" : "未通過"}｜${result.name}${result.error ? `｜${result.error}` : ""}</li>`
        ).join("");
        document.title = passed === results.length ? "全部通過｜人生主控表測試" : "測試未通過｜人生主控表測試";
      })();
    </script>
  </body>
</html>
